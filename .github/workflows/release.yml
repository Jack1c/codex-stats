name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 需要完整历史，才能算出与上一个 tag 的差异
          fetch-depth: 0

      - name: 构建 app
        run: ./build.sh

      - name: 打包产物
        run: |
          set -euo pipefail
          zip -qry "CodexStats-${GITHUB_REF_NAME}.zip" CodexStats.app
          shasum -a 256 "CodexStats-${GITHUB_REF_NAME}.zip" > checksums.txt
          cat checksums.txt

      - name: 生成本次发布的代码总结
        run: |
          set -euo pipefail
          previous_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          # 空树对象，用于首个版本时统计全部文件
          empty_tree=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..${GITHUB_REF_NAME}"
          else
            range="${GITHUB_REF_NAME}"
          fi

          {
            echo "## ${GITHUB_REF_NAME} 变更总结"
            echo
            if [ -n "$previous_tag" ]; then
              echo "对比范围：\`${previous_tag}\` → \`${GITHUB_REF_NAME}\`"
            else
              echo "首个版本，汇总仓库初始提交。"
            fi
            echo
            echo "### 提交列表"
            echo
            git log --no-merges --pretty='- %s（`%h`）' "$range"
            echo
            echo "### 代码改动统计"
            echo
            echo '```'
            if [ -n "$previous_tag" ]; then
              git diff --stat "$previous_tag" "${GITHUB_REF_NAME}"
            else
              git diff --stat "$empty_tree" "${GITHUB_REF_NAME}"
            fi
            echo '```'
          } > RELEASE_BODY.md

          cat RELEASE_BODY.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          files: |
            CodexStats-${{ github.ref_name }}.zip
            checksums.txt
